# MCP server registry — neutral schema for cross-CLI MCP configuration.
#
# Adapters translate to each CLI's native format:
#   - Claude: ~/.claude/settings.json `mcp_servers` (JSON)
#   - Gemini: ~/.gemini/settings.json `mcpServers` (JSON)
#   - Codex:  ~/.codex/config.toml `[mcp_servers.<name>]` (TOML)
#
# Per-server fields:
#   type           stdio | http
#   command        (stdio) executable
#   args           (stdio) array of arguments
#   url            (http) endpoint
#   env            map of env vars (use ${VAR} for runtime resolution)
#   enabled-for    subset of [claude, gemini, codex]; default = all three
#   description    free-form note
#
# Adapters preserve user-added servers via a "managed by workspace" comment
# block in each generated config.

version: 1

servers: []

# Examples (commented out; copy into `servers:` to enable):
#
# servers:
#   - name: github
#     type: stdio
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-github"]
#     env:
#       GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"
#     enabled-for: [claude, gemini, codex]
#     description: GitHub MCP server (issues, PRs, repos)
#
#   - name: context7
#     type: http
#     url: https://context7.io/mcp
#     enabled-for: [claude, codex]
#     description: Library documentation lookup

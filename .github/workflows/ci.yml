name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  shellcheck:
    name: ShellCheck (scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck --severity=warning scripts/*.sh

  unit-tests:
    name: Unit tests (installers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  markdown-lint:
    name: Markdown Lint & Internal Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Run markdownlint (non-blocking, warnings only)
        run: |
          markdownlint-cli2 \
            "**/*.md" \
            "#node_modules" \
            "#docs/blog-archive" \
            --config .markdownlint.json 2>&1 || echo "WARN: markdown lint found issues (non-blocking)"
        continue-on-error: true


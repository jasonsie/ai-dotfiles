name: Sync upstream docs

on:
  schedule:
    # Mondays 01:00 UTC (09:00 UTC+8)
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-cli-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: upstream-sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A source whose index or fetches fall below its page floor keeps last week's
      # copy and makes this step's status non-zero; the review PR says so. The skill
      # catalogs record which skills each watched collection has, so the report can
      # list new ones.
      - name: Refresh mirrors and skill catalogs
        run: |
          status=0
          bash scripts/upstream/sync-cli-docs.sh || status=$?
          python scripts/upstream/report-upstream.py --update-catalogs || status=1
          echo "SYNC_STATUS=$status" >> "$GITHUB_ENV"

      # Changes never land on main directly: they go to one review branch whose pull
      # request is opened or refreshed each week, with a summary of what changed and
      # what touches this setup.
      - name: Open or update the review pull request
        run: |
          git add docs/upstream
          if git diff --cached --quiet; then
            echo "No upstream changes."
          else
            python scripts/upstream/report-upstream.py > "$RUNNER_TEMP/report.md"
            if [ "$SYNC_STATUS" != "0" ]; then
              printf '\n> A source failed or fell below its page floor, so its previous copy was kept. See the workflow log.\n' >> "$RUNNER_TEMP/report.md"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git switch -C "$BRANCH"
            git commit -q -m "Sync upstream docs — $(date -u +%F)"
            git push --force origin "$BRANCH"
            title="Upstream docs — $(date -u +%F)"
            if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
              gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/report.md"
            else
              gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/report.md"
            fi
          fi
          exit "$SYNC_STATUS"
